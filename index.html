function tempText(t){if(!t||t.min==null||t.max==null)return 'See source'; return tempUnit==='celsius'?`${fmt(t.min)}–${fmt(t.max)} °C`:`${fmt(ctof(t.min))}–${fmt(ctof(t.max))} °F`}
function idealText(t){if(!t||t.ideal==null)return 'See source'; return tempUnit==='celsius'?`${fmt(t.ideal)} °C`:`${fmt(ctof(t.ideal))} °F`}
function unitHook(h){return h}
function renderSelector(){const s=document.getElementById('reserveSelect');s.innerHTML=Object.keys(DATA.reserves).map(n=>`<option>${esc(n)}</option>`).join('');s.value=reserveName;s.onchange=()=>safeSwitchReserve(s.value)}
function switchReserve(n){if(!DATA.reserves[n])return;reserveName=n;currentFish=null;mapState.home={scale:1,x:0,y:0};mapState.fish={scale:1,x:0,y:0};const rv=document.getElementById('reserveView'),fv=document.getElementById('fishView');fv.classList.remove('active');fv.innerHTML='';fv.style.display='none';rv.style.display='block';document.getElementById('back').style.display='none';renderReserve();const sel=document.getElementById('reserveSelect');if(sel)sel.value=n;window.scrollTo(0,0)}
function safeSwitchReserve(n){try{switchReserve(n)}catch(e){console.error(e);const rv=document.getElementById('reserveView');const fv=document.getElementById('fishView');fv.classList.remove('active');fv.style.display='none';rv.style.display='block';rv.innerHTML='<div class="card"><h2>Reserve loaded with a temporary display error</h2><p class="note">The reserve data is still available. Reloading this reserve should not be necessary; use the selector again or refresh the page.</p></div>'}}
function renderReserve(){const r=reserve(); if(!r||!Array.isArray(r.fish)||!r.records) throw new Error('Reserve data is incomplete');document.getElementById('reserveView').innerHTML=`<div class="hero reserveHero"><div class="reserveHeroTop"><img class="reserveLogo" src="${RESERVE_IMAGES[reserveName]||''}" alt="${esc(reserveName)} logo" onerror="this.style.display='none';this.parentElement.insertAdjacentText('afterbegin','🎣')"><div><div class="eyebrow">Reserve Guide · ${esc(r.region)}</div><h1>${esc(reserveName)}</h1></div></div><p>Interactive reserve map and catch reference in the same dark-green guide format. Zoom, pan, search species and jump directly to the fish page.</p><div class="stats">${r.stats.map(x=>`<div class="pill">${esc(x)}</div>`).join('')}<div class="pill">⚖️ ${unit==='metric'?'Metric':'Imperial'}</div><div class="pill">🌡️ ${tempUnit==='celsius'?'°C':'°F'}</div></div></div>
<div class="section"><h2>${esc(reserveName)} interactive map</h2><div class="searchbar"><input id="mapFishSearch" class="input" placeholder="Search a fish for hotspot/source locations…"><button class="switch" id="mapSearchBtn">Find fish</button></div><div id="mapSearchResults" class="note">Search a fish to jump to its page and source hotspot map.</div><div class="hotspotChips" id="hotspotChips"></div><div class="map" id="homeMap"><div class="mapviewport"><div class="mapcanvas" id="homeMapCanvas"><img src="${r.map}" alt="${esc(reserveName)} complete map"><div class="hotspotLayer hidden" id="homeHotspotLayer"><img id="homeHotspotImg" alt="Selected fish hotspot map"></div></div></div><div class="maplayers"><span class="layerbtn active">🟣 Shops / fast travel</span><span class="layerbtn active">🟡 Outposts</span><span class="layerbtn active">🔵 Water / boat areas</span><span class="layerbtn active">🟠 Road / vehicle areas</span><span class="layerbtn active">🟢 Fish map search</span></div><div class="maptools"><button data-map="home" data-zoom="in">+</button><button data-map="home" data-zoom="out">−</button><button data-map="home" data-zoom="reset">⌂</button><a class="mapfull" href="${r.map}" target="_blank" rel="noopener" title="Open full-resolution map">↗</a></div></div><div class="note">The complete-map artwork is the high-resolution reserve map from The Angler Wiki. It already contains the reserve's discovered location symbols. Use zoom/pan for detail and the full-resolution button for the original map.</div><div class="source">Map source: <a href="${r.source}" target="_blank" rel="noopener">The Angler Wiki reserve page</a>.</div></div>
<div class="section"><h2>Fish in ${esc(reserveName)}</h2><div class="searchbar"><input class="input" id="fishSearch" placeholder="Search fish…"><select class="select" id="tempFilter"><option value="">Any ideal temperature</option><option value="cold">≤ 10°C</option><option value="warm">&gt; 10°C</option></select></div><div class="grid" id="fishGrid"></div></div>
<div class="section"><h2>Other reserves</h2><div class="reserveCards">${Object.entries(DATA.reserves).map(([n,x])=>`<div class="reserveCard" data-reserve="${esc(n)}"><img class="reserveCardImg" src="${RESERVE_IMAGES[n]||''}" alt="${esc(n)}" loading="lazy" onerror="this.style.display='none';this.parentElement.insertAdjacentText('afterbegin','🎣')"><h3>${esc(n)}</h3><p>${esc(x.region)}</p><div class="mini">${x.stats.join(' · ')}</div></div>`).join('')}</div></div>`;
 document.getElementById('mapSearchBtn').onclick=findMapFish;document.getElementById('mapFishSearch').onkeydown=e=>{if(e.key==='Enter')findMapFish()};document.getElementById('fishSearch').oninput=renderFishGrid;document.getElementById('tempFilter').onchange=renderFishGrid;document.querySelectorAll('[data-reserve]').forEach(b=>b.onclick=()=>switchReserve(b.dataset.reserve));document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>zoomMap(b.dataset.map,b.dataset.zoom));renderFishGrid();buildHotspotChips();enablePan('home');applyMapTransform('home')}
function buildHotspotChips(){const r=reserve(),root=document.getElementById('hotspotChips');root.innerHTML=r.fish.filter(n=>r.records[n]&&r.records[n].hotspotMap).map(n=>`<button class="hotspotChip" data-fish="${esc(n)}">${esc(n)}</button>`).join('');root.querySelectorAll('[data-fish]').forEach(b=>b.onclick=()=>{if(r.records[b.dataset.fish].hotspotMap){setHomeHotspot(b.dataset.fish)}else openFish(b.dataset.fish)})}
function setHomeHotspot(n){const d=reserve().records[n],layer=document.getElementById('homeHotspotLayer'),img=document.getElementById('homeHotspotImg'),canvas=document.getElementById('homeMapCanvas'),out=document.getElementById('mapSearchResults');if(!layer||!img||!d||!d.hotspotMap)return;canvas.classList.add('hotspot-active');img.onerror=()=>{layer.classList.add('hidden');canvas.classList.remove('hotspot-active');out.innerHTML=`<b>${esc(n)}</b>: hotspot image could not be loaded. <a href="${d.hotspotSource}" target="_blank" rel="noopener" class="linkbtn">Open source map</a>`};img.onload=()=>layer.classList.remove('hidden');img.src=d.hotspotMap;out.innerHTML=`<b>${esc(n)}</b>: showing the wiki's known hotspot map. Other ranks can also be caught there; it is not a Diamond guarantee.`;layer.classList.remove('hidden')}
function findMapFish(){const q=document.getElementById('mapFishSearch').value.trim().toLowerCase(),r=reserve(),n=r.fish.find(x=>x.toLowerCase().includes(q)),out=document.getElementById('mapSearchResults');if(!q){out.textContent='Search a fish to open its guide or show its verified hotspot overlay.';return}if(!n){out.textContent='No fish matched that search in this reserve.';return}const d=r.records[n];if(d.hotspotMap){setHomeHotspot(n)}else{out.innerHTML=`<b>${esc(n)}</b>: this reserve has a verified species hotspot page, but no direct overlay is used here unless the image URL is verified. Opening the fish guide instead.`;openFish(n)}}
function imageCandidates(name,current){const aliases={"African Sharptooth Catfish":'https://theangler.org/wp-content/uploads/2024/04/African-Sharptooth-Carp-1024x484.webp',"Tiger Muskie (Muskellunge)":'https://theangler.org/wp-content/uploads/2024/04/Tiger-Muskie-1024x484.webp'};const slug=name.replace(/\(.*?\)/g,'').trim().replace(/&/g,'and').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'');const base=slug+'-1024x484.webp';const years=['2024/04','2024/06','2024/08','2024/10','2025/01','2025/02','2025/03'];const urls=years.map(y=>`https://theangler.org/wp-content/uploads/${y}/${base}`);return [current,aliases[name],...urls.filter(x=>x!==current)].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i);}function handleFishImageError(img){img.onerror=null;const name=img.dataset.fishName||img.alt||'';const tried=parseInt(img.dataset.try||'0',10);const list=imageCandidates(name,img.dataset.original||img.src);if(tried+1<list.length){img.dataset.original=img.dataset.original||img.src;img.dataset.try=String(tried+1);img.onerror=function(){handleFishImageError(this)};img.src=list[tried+1];return}const wrap=img.parentElement;if(wrap)wrap.innerHTML=`<div class="imgFallback">🐟<small>${esc(name)} image unavailable</small></div>`;}function renderFishGrid(){const r=reserve(),q=(document.getElementById('fishSearch')?.value||'').toLowerCase(),tf=document.getElementById('tempFilter')?.value||'',root=document.getElementById('fishGrid');root.innerHTML=r.fish.filter(n=>{const d=r.records[n];return n.toLowerCase().includes(q)&&(!tf||(tf==='cold'?d.temperature.ideal<=10:d.temperature.ideal>10))}).map(n=>{const d=r.records[n];return `<div class="fish" data-fish="${esc(n)}"><div class="fishpic">${d.image?`<img src="${d.image}" alt="${esc(n)}" onerror="handleFishImageError(this)">`:'🐟'}</div><div class="fishbody"><h3>${esc(n)}</h3><p>Max ${esc(d.weight)} · Ideal ${esc(idealText(d.temperature))}</p></div></div>`}).join('')||'<div class="mutedBox">No fish match that filter.</div>';root.querySelectorAll('[data-fish]').forEach(x=>x.onclick=()=>openFish(x.dataset.fish))}
function hookRows(d){let html=Object.entries(d.hookMap||{}).filter(([h])=>hooks.includes(h)).map(([h,rank])=>`<tr><td class="rank">${esc(h)}</td><td>${esc(rank)}</td></tr>`).join('');return html||'<tr><td colspan="2">No verified hook chart.</td></tr>'}
function wikiSection(text,heading,nextHeading){const a=text.indexOf(heading);if(a<0)return'';const b=nextHeading?text.indexOf(nextHeading,a+heading.length):-1;return text.slice(a+heading.length,b<0?text.length:b).trim()}
function parseWikiMarkdown(md,d){
  const general=wikiSection(md,'### General Information','### Summary');
  const habitatsSec=wikiSection(md,'### Habitats','### Bait & Lure Preferences');
  const baitSec=wikiSection(md,'### Bait & Lure Preferences','### Traits');
  const traitSec=wikiSection(md,'### Traits','### Tips for catching');
  const tips=wikiSection(md,'### Tips for catching','### Also in');
  const mWeight=general.match(/Weight\s+([^\n]+)/i); if(mWeight)d.weight=mWeight[1].trim().replace(/\s{2,}/g,' ');
  const mTime=general.match(/Time of Day([^\n]+)/i); if(mTime)d.time=mTime[1].trim();
  const mTemp=general.match(/Water Temp Range\s+([0-9.]+)°C\s*[—-]\s*([0-9.]+)°C/i); if(mTemp)d.temperature={min:+mTemp[1],ideal:d.temperature?.ideal??null,max:+mTemp[2]};
  const mIdeal=general.match(/Ideal Water Temp\s+([0-9.]+)°C/i); if(mIdeal){d.temperature=d.temperature||{};d.temperature.ideal=+mIdeal[1]}
  const mSpawn=general.match(/Spawn Depth Range\s+([^\n]+)/i); if(mSpawn)d.spawnDepth=mSpawn[1].trim();
  const mMax=general.match(/Max Water Depth\s+([0-9.]+)m/i); if(mMax)d.maxDepth=+mMax[1];
  if(habitatsSec){const hm=habitatsSec.match(/can be found in\s+(.+?)(?:\.|$)/i);if(hm)d.habitats=hm[1].split(/,\s*|\s+and\s+/).map(x=>x.trim()).filter(Boolean)}
  const pref=tips.match(/preferes\s+(.+?)\s+as bait/i); if(pref)d.preferred=pref[1].trim();
  if(baitSec){const arr=[];const re=/([^,\n]+?)\s*\((\d+)%\)/g;let x;while((x=re.exec(baitSec))){const name=x[1].replace(/^\s*[•*-]\s*/,'').trim();if(name&&name.length<80)arr.push([name,+x[2]])}if(arr.length)d.baits=arr}
  if(traitSec){const arr=[];const re=/\n([A-Z][A-Za-z]+(?:\s+[A-Z][A-Za-z]+){0,3}):\s*\n/g;let x;while((x=re.exec(traitSec))){const name=x[1].trim();if(!/^(Image|The|Tap)$/i.test(name))arr.push(name)}if(arr.length)d.traits=[...new Set(arr)]}
  const img=(md.match(/!\[[^\]]*\]\((https?:\/\/[^)]+)\)/)||[])[1];if(img)d.image=img;
  d.wikiHydrated=true;return d;
}
async function hydrateFishFromWiki(n,d){
  if(d.wikiHydrated || (d.baits&&d.baits.length&&d.preferred&&d.time&&d.spawnDepth&&d.maxDepth!=null&&d.traits&&d.traits.length))return false;
  try{
    const url='https://r.jina.ai/'+(d.source||'');
    const res=await fetch(url,{cache:'force-cache'}); if(!res.ok)throw new Error('Wiki fetch failed');
    const md=await res.text(); if(!md||md.length<500)throw new Error('Wiki content unavailable');
    parseWikiMarkdown(md,d);return true;
  }catch(e){console.warn('Wiki hydration failed for',n,e);d.wikiHydrated=true;return false}
}
function openFish(n){currentFish=n;const r=reserve(),d=r.records[n];if(!d)return;document.getElementById('reserveView').style.display='none';const f=document.getElementById('fishView');f.classList.add('active');f.style.display='block';document.getElementById('back').style.display='inline-block';
  const legend=(DATA.legendaryHooks[reserveName]&&DATA.legendaryHooks[reserveName][n])||{};let legRows=Object.entries(legend).map(([ln,hs])=>`<tr class="legendary-row"><td class="rank">Legendary</td><td>${esc(ln)} — ${hs.join(', ')}</td></tr>`).join('');
  const img=d.image?`<div class="imageWrap" style="height:340px"><img class="heroimg fishHeroImage" data-fish-name="${esc(n)}" src="${d.image}" alt="${esc(n)}" onerror="handleFishImageError(this)"></div>`:`<div class="imgFallback" style="height:340px">🐟</div>`;
  const habitats=(d.habitats&&d.habitats.length)?d.habitats.map(x=>`<span class="tag">${esc(x)}</span>`).join(''):'<div class="mutedBox">Loading habitat information…</div>';
  const depth=d.spawnDepth||'See source'; const shownWeight=weightText(d.weight); const shownDepth=depthText(depth); const shownMaxDepth=d.maxDepth!=null?depthText(d.maxDepth):'See source'; const preferred=d.preferred||'See source'; const bestTime=d.time||'See source';
  const baits=(d.baits&&d.baits.length)?d.baits.map(x=>`<span class="tag">${esc(x[0])} · ${x[1]}%</span>`).join(''):'<div class="mutedBox">Loading bait & lure preferences…</div>';
  const traits=(d.traits&&d.traits.length)?d.traits.map(x=>`<span class="tag">${esc(x)}</span>`).join(''):'<div class="mutedBox">Loading traits…</div>';
  const hotspot=d.hotspotMap?`<div class="map" id="fishMap"><div class="mapviewport"><div class="mapcanvas" id="fishMapCanvas"><img src="${r.map}" alt="${esc(reserveName)} base map"><div class="hotspotLayer" id="fishHotspotLayer"><img id="fishHotspotImg" src="${d.hotspotMap}" alt="${esc(n)} hotspot map"></div></div></div><div class="maptools"><button data-map="fish" data-zoom="in">+</button><button data-map="fish" data-zoom="out">−</button><button data-map="fish" data-zoom="reset">⌂</button><a class="mapfull" href="${d.hotspotMap}" target="_blank" rel="noopener">↗</a></div></div>`:`<div class="mutedBox">No embedded hotspot image is available for this species yet.</div>`;
  f.innerHTML=`<div class="hero"><div class="eyebrow">${esc(reserveName)} · Fish Guide</div><h1>${esc(n)}</h1><p>Complete species reference with the same catch information format used for Golden Ridge.</p><div class="stats"><div class="pill">🐟 ${esc(shownWeight)}</div><div class="pill">🌡️ Ideal ${esc(idealText(d.temperature))}</div><div class="pill">🪝 Hook chart</div></div></div><div class="detailgrid section"><div><div class="card">${img}<div class="status"><span>Temp: ${esc(tempText(d.temperature))}</span><span>Ideal: ${esc(idealText(d.temperature))}</span></div><div class="rows"><div class="row"><small>Preferred bait</small><strong>${esc(preferred)}</strong></div><div class="row"><small>Best time</small><strong>${esc(bestTime)}</strong></div><div class="row"><small>Maximum weight</small><strong>${esc(shownWeight)}</strong></div><div class="row"><small>Depth</small><strong>${esc(shownDepth)}</strong></div><div class="row"><small>Maximum water depth</small><strong>${d.maxDepth!=null?esc(shownMaxDepth):'See source'}</strong></div></div><div class="section"><h2>Habitat</h2>${habitats}</div><div class="source"><a href="${d.source}" target="_blank" rel="noopener">The Angler Wiki species source</a></div></div><div class="card" style="margin-top:18px"><h2>Species hotspot map</h2>${hotspot}</div></div><div><div class="card"><h2>Bait & lure preferences</h2>${baits}</div><div class="card" style="margin-top:18px"><h2>Traits</h2>${traits}</div><div class="card" style="margin-top:18px"><h2>Hook sizes by target rank</h2><table class="hooks"><thead><tr><th>Hook</th><th>Target rank</th></tr></thead><tbody>${hookRows(d)}${legRows}</tbody></table><div class="note">Hook sizes above 4/0 are intentionally excluded.</div></div></div></div><div class="card" style="margin-top:18px"><h2>Complete fish information</h2><div class="rows"><div class="row"><small>Reserve</small><strong>${esc(reserveName)}</strong></div><div class="row"><small>Species</small><strong>${esc(n)}</strong></div><div class="row"><small>Weight range</small><strong>${esc(shownWeight)}</strong></div><div class="row"><small>Water temperature</small><strong>${esc(tempText(d.temperature))}</strong></div><div class="row"><small>Ideal temperature</small><strong>${esc(idealText(d.temperature))}</strong></div><div class="row"><small>Time of day</small><strong>${esc(bestTime)}</strong></div><div class="row"><small>Spawn depth</small><strong>${esc(shownDepth)}</strong></div><div class="row"><small>Maximum depth</small><strong>${d.maxDepth!=null?esc(shownMaxDepth):'See source'}</strong></div><div class="row"><small>Preferred bait/lure</small><strong>${esc(preferred)}</strong></div></div><div class="section"><h2>Habitat</h2>${habitats}</div><div class="section"><h2>Bait & lure preferences</h2>${baits}</div><div class="section"><h2>Traits</h2>${traits}</div></div><div class="card" style="margin-top:18px"><h2>Source</h2><div class="source"><a href="${d.source}" target="_blank" rel="noopener">The Angler Wiki species page</a></div><div class="note">Fish information in this build is embedded locally; no live Wiki fetch is required.</div></div>`;
  document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>zoomMap(b.dataset.map,b.dataset.zoom));if(d.hotspotMap)enablePan('fish');window.scrollTo(0,0);
  if(!d.wikiHydrated){hydrateFishFromWiki(n,d).then(changed=>{if(changed&&currentFish===n&&reserveName===rnameSafe())openFish(n)})}
}
function rnameSafe(){return reserveName}

function applyMapTransform(id){const st=mapState[id],el=document.getElementById(id==='home'?'homeMapCanvas':'fishMapCanvas');if(!el)return;if(st.scale===1&&st.x===0&&st.y===0)el.style.transform='none';else el.style.transform=`translate(${st.x}px,${st.y}px) scale(${st.scale})`}
function zoomMap(id,dir){const st=mapState[id];if(dir==='reset'){st.scale=1;st.x=0;st.y=0}else st.scale=Math.max(.75,Math.min(3,st.scale*(dir==='in'?1.25:.8)));applyMapTransform(id)}
function enablePan(id){const vp=document.querySelector('#'+(id==='home'?'homeMap':'fishMap')+' .mapviewport');if(!vp||vp.dataset.pan)return;vp.dataset.pan='1';let drag=false,sx=0,sy=0,ox=0,oy=0;vp.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sy=e.clientY;ox=mapState[id].x;oy=mapState[id].y;vp.setPointerCapture(e.pointerId)});vp.addEventListener('pointermove',e=>{if(!drag)return;mapState[id].x=ox+e.clientX-sx;mapState[id].y=oy+e.clientY-sy;applyMapTransform(id)});vp.addEventListener('pointerup',()=>drag=false);vp.addEventListener('wheel',e=>{e.preventDefault();zoomMap(id,e.deltaY<0?'in':'out')},{passive:false})}
function setOrientation(mode){orientation=mode==='portrait'?'portrait':'landscape';document.body.classList.toggle('orientation-portrait',orientation==='portrait');document.body.classList.toggle('orientation-landscape',orientation==='landscape');const b=document.getElementById('orientationToggle');if(b){b.textContent=orientation==='portrait'?'📱 Vertical':'🖥 Horizontal';b.title=orientation==='portrait'?'Switch to horizontal layout':'Switch to vertical phone layout';}try{localStorage.setItem('anglerGuideOrientation',orientation)}catch(e){}}
function initOrientation(){let saved='';try{saved=localStorage.getItem('anglerGuideOrientation')||''}catch(e){} if(saved!=='portrait'&&saved!=='landscape')saved=window.matchMedia&&window.matchMedia('(max-width: 780px)').matches?'portrait':'landscape';setOrientation(saved)}
document.getElementById('back').onclick=()=>{document.getElementById('fishView').classList.remove('active');document.getElementById('fishView').style.display='none';document.getElementById('reserveView').style.display='block';document.getElementById('back').style.display='none';renderReserve();window.scrollTo(0,0)};document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{unit=b.dataset.unit;document.querySelectorAll('[data-unit]').forEach(x=>x.classList.toggle('active',x===b));renderReserve();if(currentFish)openFish(currentFish)});document.getElementById('tempUnit').onclick=()=>{tempUnit=tempUnit==='celsius'?'fahrenheit':'celsius';document.getElementById('tempUnit').textContent=tempUnit==='celsius'?'°C':'°F';renderReserve();if(currentFish)openFish(currentFish)};document.getElementById('orientationToggle').onclick=()=>setOrientation(orientation==='portrait'?'landscape':'portrait');let orientation='landscape';try{initOrientation();renderSelector();renderReserve()}catch(e){console.error(e);document.getElementById('reserveView').innerHTML='<div class="card"><h2>Guide loading error</h2><p class="note">Refresh the guide to reload the reserve data.</p></div>'}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
</script></body></html>
