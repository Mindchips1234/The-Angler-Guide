/* App shell: native feel */
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button,select,.tabbar,.brand,.homeReserve,.reserveCard,.fish,.hotspotChip,.homeResult{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

button:active:not(:disabled){transform:scale(.97);transition:transform .08s}

/* Intro */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#123236,#050b0c 70%);color:var(--text);cursor:pointer;transition:opacity .45s ease}
#intro.out{opacity:0;pointer-events:none}
#intro[hidden]{display:none}
.introStudio,.introApp{grid-area:1/1;text-align:center;opacity:0}
.introStudio span{display:block;font-size:clamp(20px,5vw,30px);font-weight:300;letter-spacing:.18em;text-transform:uppercase}
.introStudio small{display:block;margin-top:10px;color:var(--muted);font-size:13px;letter-spacing:.4em;text-transform:uppercase}
.introApp img{width:min(30vw,132px);height:auto;border-radius:28%;box-shadow:0 0 0 1px #2a3d40,0 18px 60px #55c2a055}
.introApp b{display:block;margin-top:18px;font-size:clamp(26px,7vw,38px);font-weight:900}
.introApp b span{color:var(--accent)}
.introSkip{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:11px;color:#5d7472;letter-spacing:.12em;text-transform:uppercase}
#intro.play .introStudio{animation:introStudio 1.9s ease .15s both}
#intro.play .introApp{animation:introApp 1.6s cubic-bezier(.2,.8,.2,1) 2s both}
#intro.play .introApp b{animation:introName .7s ease 2.35s both}
@keyframes introStudio{0%{opacity:0;transform:translateY(10px);letter-spacing:.3em}25%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0;transform:scale(1.04)}}
@keyframes introApp{0%{opacity:0;transform:scale(.72)}45%{opacity:1;transform:scale(1.05)}65%,100%{opacity:1;transform:scale(1)}}
@keyframes introName{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* Screen transitions */
.enter-fwd{animation:enterFwd .26s cubic-bezier(.2,.8,.2,1)}
.enter-back{animation:enterBack .26s cubic-bezier(.2,.8,.2,1)}
.enter-fade{animation:enterFade .2s ease}
@keyframes enterFwd{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes enterBack{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes enterFade{from{opacity:0}to{opacity:1}}

function mkMap(host,base){
  host.innerHTML=`<div class="mapviewport"><div class="mapcanvas"><img src="${base}" alt="Reserve map" referrerpolicy="no-referrer"><div class="hotspotLayer hidden"><img alt="Hotspot overlay" referrerpolicy="no-referrer"></div></div></div><div class="maptools"><button data-z="in" aria-label="Zoom in">+</button><button data-z="out" aria-label="Zoom out">−</button><button data-z="reset" aria-label="Reset view">⌂</button><a class="mapfull" href="${base}" target="_blank" rel="noopener" aria-label="Open full map">↗</a></div>`;
  const vp=$('.mapviewport',host),cv=$('.mapcanvas',host),ly=$('.hotspotLayer',host),oi=$('img',ly),s={k:1,x:0,y:0},pts=new Map();let d0=1,k0=1;
  const ap=()=>cv.style.transform=`translate(${s.x}px,${s.y}px) scale(${s.k})`,cl=k=>Math.max(.75,Math.min(4,k)),dist=()=>{const [a,b]=[...pts.values()];return Math.hypot(a[0]-b[0],a[1]-b[1])||1};
  vp.onpointerdown=e=>{vp.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size==2){d0=dist();k0=s.k}};
  vp.onpointermove=e=>{const p=pts.get(e.pointerId);if(!p)return;if(pts.size==1){s.x+=e.clientX-p[0];s.y+=e.clientY-p[1]}pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size==2)s.k=cl(k0*dist()/d0);ap()};
  vp.onpointerup=vp.onpointercancel=e=>pts.delete(e.pointerId);
  vp.onwheel=e=>{if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();s.k=cl(s.k*(e.deltaY<0?1.15:.87));ap()};
  host.onclick=e=>{const z=e.target.closest('[data-z]');if(!z)return;if(z.dataset.z==='reset'){s.k=1;s.x=s.y=0}else s.k=cl(s.k*(z.dataset.z==='in'?1.25:.8));ap()};
  const clear=()=>{ly.classList.add('hidden');cv.classList.remove('hotspot-active')};
  return{clear,show(url,fail){cv.classList.add('hotspot-active');oi.onload=()=>ly.classList.remove('hidden');oi.onerror=()=>{clear();fail&&fail()};oi.src=url}};
}

function renderHomeResults(query){
  const target=$('#homeResults');if(!target)return;
  const q=query.trim().toLowerCase(),selected=$('#homeReserveFilter')?$('#homeReserveFilter').value:'';
  const names=selected?[selected]:Object.keys(DATA.reserves),matches=[];
  for(const rn of names){
    const r=DATA.reserves[rn];if(!r)continue;
    for(const n of r.fish){
      if(!q||n.toLowerCase().includes(q)){
        const d=r.records[n]||{};
        matches.push({reserve:rn,fish:n,bait:d.preferred||(d.baits&&d.baits[0]&&d.baits[0][0])||'See fish guide'});
      }
    }
  }
  const count=$('#homeResultsCount');
  if(count)count.textContent=(q||selected)?(matches.length+' fish found'):'Search across all reserves';
  if(!q&&!selected){target.innerHTML='<div class="homeHint">Type a fish name or choose a reserve to browse its fish. Select any result to open its full guide.</div>';return}
  const shown=matches.slice(0,24);
  target.innerHTML=shown.length?shown.map(x=>'<button class="homeResult" data-home-fish="'+esc(x.reserve+'::'+x.fish)+'"><span><strong>'+esc(x.fish)+'</strong><small>'+esc(x.reserve)+'</small><small class="homeBait">Preferred bait: '+esc(x.bait)+'</small></span><span aria-hidden="true">→</span></button>').join('')+(matches.length>shown.length?'<div class="homeHint">Showing the first '+shown.length+' of '+matches.length+' results. Add more letters to narrow your search.</div>':''):'<div class="mutedBox">No fish found. Try another name or select a different reserve.</div>';

  addEventListener('touchstart',e=>{const t=e.touches[0];el=null;if(e.touches.length!==1||t.clientX>24||!DEPTH[screen]||dlg3d.open||e.target.closest('.mapviewport,.m3dCanvas'))return;
    sx=t.clientX;sy=t.clientY;dx=0;el=screen==='fish'?fv:rv},{passive:true});
  addEventListener('touchmove',e=>{if(!el)return;const t=e.touches[0];dx=t.clientX-sx;
    if(Math.abs(t.clientY-sy)>Math.abs(dx)&&dx<24){el.style.transform=el.style.opacity='';el=null;return}
    el.style.transform=`translateX(${Math.max(0,dx)}px)`;el.style.opacity=1-Math.min(.5,Math.max(0,dx)/500)},{passive:true});
  addEventListener('touchend',()=>{if(!el)return;const v=el;el=null;v.style.transition='transform .2s ease,opacity .2s ease';
    if(dx>90){haptic();goUp()}v.style.transform=v.style.opacity='';setTimeout(()=>{v.style.transition=''},220)});
}

// Offline badge
const offline=$('#offline'),net=()=>{offline.hidden=navigator.onLine};addEventListener('online',net);addEventListener('offline',net);net();
// Service worker: offline support plus an "update ready" prompt when a new release is installed.
if('serviceWorker' in navigator)addEventListener('load',()=>{
  let updating=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(updating)location.reload()});
  navigator.serviceWorker.register('./service-worker.js').then(reg=>{
    const offer=w=>{if(!w||!navigator.serviceWorker.controller)return;const u=$('#update');u.hidden=false;
      $('#updateBtn').onclick=()=>{updating=true;u.querySelector('span').textContent='Updating…';w.postMessage('skipWaiting')}};
    offer(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed')offer(w)})});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
  }).catch(()=>{});
});
</script></body></html>
