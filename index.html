.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.fish .hit{color:var(--gold);font-size:11px;margin-top:4px}

.primaryAction{background:var(--accent);color:#071613;border:1px solid var(--accent)}

.homeHint{color:var(--muted);font-size:12px;line-height:1.6;margin-top:18px}

function mkMap(host,base){
  host.innerHTML=`<div class="mapviewport"><div class="mapcanvas"><img src="${base}" alt="Reserve map" referrerpolicy="no-referrer"><div class="hotspotLayer hidden"><img alt="Hotspot overlay" referrerpolicy="no-referrer"></div></div></div><div class="maptools"><button data-z="in" aria-label="Zoom in">+</button><button data-z="out" aria-label="Zoom out">−</button><button data-z="reset" aria-label="Reset view">⌂</button><a class="mapfull" href="${base}" target="_blank" rel="noopener" aria-label="Open full map">↗</a></div>`;
  const vp=$('.mapviewport',host),cv=$('.mapcanvas',host),ly=$('.hotspotLayer',host),oi=$('img',ly),s={k:1,x:0,y:0},pts=new Map();let d0=1,k0=1;
  const ap=()=>cv.style.transform=`translate(${s.x}px,${s.y}px) scale(${s.k})`,cl=k=>Math.max(.75,Math.min(4,k)),dist=()=>{const [a,b]=[...pts.values()];return Math.hypot(a[0]-b[0],a[1]-b[1])||1};
  vp.onpointerdown=e=>{vp.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size==2){d0=dist();k0=s.k}};
  vp.onpointermove=e=>{const p=pts.get(e.pointerId);if(!p)return;if(pts.size==1){s.x+=e.clientX-p[0];s.y+=e.clientY-p[1]}pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size==2)s.k=cl(k0*dist()/d0);ap()};
  vp.onpointerup=vp.onpointercancel=e=>pts.delete(e.pointerId);
  vp.onwheel=e=>{if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();s.k=cl(s.k*(e.deltaY<0?1.15:.87));ap()};
  host.onclick=e=>{const z=e.target.closest('[data-z]');if(!z)return;if(z.dataset.z==='reset'){s.k=1;s.x=s.y=0}else s.k=cl(s.k*(z.dataset.z==='in'?1.25:.8));ap()};
  const clear=()=>{ly.classList.add('hidden');cv.classList.remove('hotspot-active')};
  return{clear,show(url,fail){cv.classList.add('hotspot-active');oi.onload=()=>ly.classList.remove('hidden');oi.onerror=()=>{clear();fail&&fail()};oi.src=url}};
}


function buildHome(){

  home.innerHTML=`<section class="homeHero">

    <h1>Find your next<br>great catch.</h1>
    <p>Explore reserves, discover fish, and find the bait, conditions and tackle information to plan your next trip in <em>The Angler</em>.</p>
    <div class="stats"><span class="pill">🗺️ ${names.length} reserves</span><span class="pill">🐟 ${fishTotal}+ fish entries</span><span class="pill">🎯 Bait &amp; hotspot guides</span></div>
    <div class="homeActions"><button class="primaryAction" id="browseReserves">Browse reserves <span aria-hidden="true">→</span></button><button class="secondaryAction" id="randomFish">Surprise me with a fish</button></div>

    <div class="homeReserveGrid">${names.map(n=>{const r=DATA.reserves[n];return `<button class="homeReserve" data-home-reserve="${esc(n)}"><img src="${RIMG[n]||''}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'"><h3>${esc(n)}</h3><p>${esc(REGION[n]||r.region)}</p><div class="mini">${esc(r.stats.join(' · '))}</div><span class="linkbtn">Open reserve →</span></button>`}).join('')}</div>
    <p class="homeHint">Tip: choose a reserve to see its interactive map, filter fish by bait or habitat, and open individual fish guides.</p>
  </section>`;
  $('#homeReserveFilter').innerHTML='<option value="">All reserves</option>'+names.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('');
  home.oninput=e=>{if(e.target.id==='homeQuery')renderHomeResults(e.target.value)};
  home.onchange=e=>{if(e.target.id==='homeReserveFilter')renderHomeResults($('#homeQuery').value)};
  home.onclick=e=>{
    const card=e.target.closest('[data-home-reserve]');
    if(card)go(card.dataset.homeReserve);
    if(e.target.closest('#browseReserves'))$('#reserveDirectory').scrollIntoView({behavior:'smooth',block:'start'});
    if(e.target.closest('#randomFish')){const rname=names[Math.floor(Math.random()*names.length)],fish=DATA.reserves[rname].fish;go(rname,fish[Math.floor(Math.random()*fish.length)])}
    if(e.target.closest('#clearHomeSearch')){$('#homeQuery').value='';$('#homeReserveFilter').value='';renderHomeResults('');$('#homeQuery').focus()}
    const result=e.target.closest('[data-home-fish]');
    if(result){const [rname,...parts]=result.dataset.homeFish.split('::');go(rname,parts.join('::'))}
  };

}
function renderHomeResults(query){
  const target=$('#homeResults');if(!target)return;
  const q=query.trim().toLowerCase(),selected=$('#homeReserveFilter')?$('#homeReserveFilter').value:'';
  const names=selected?[selected]:Object.keys(DATA.reserves),matches=[];
  for(const rn of names){
    const r=DATA.reserves[rn];if(!r)continue;
    for(const n of r.fish){
      if(!q||n.toLowerCase().includes(q)){
        const d=r.records[n]||{};
        matches.push({reserve:rn,fish:n,bait:d.preferred||(d.baits&&d.baits[0]&&d.baits[0][0])||'See fish guide'});
      }
    }
  }
  const count=$('#homeResultsCount');
  if(count)count.textContent=(q||selected)?(matches.length+' fish found'):'Search across all reserves';
  if(!q&&!selected){target.innerHTML='<div class="homeHint">Type a fish name or choose a reserve to browse its fish. Select any result to open its full guide.</div>';return}
  const shown=matches.slice(0,24);
  target.innerHTML=shown.length?shown.map(x=>'<button class="homeResult" data-home-fish="'+esc(x.reserve+'::'+x.fish)+'"><span><strong>'+esc(x.fish)+'</strong><small>'+esc(x.reserve)+'</small><small class="homeBait">Preferred bait: '+esc(x.bait)+'</small></span><span aria-hidden="true">→</span></button>').join('')+(matches.length>shown.length?'<div class="homeHint">Showing the first '+shown.length+' of '+matches.length+' results. Add more letters to narrow your search.</div>':''):'<div class="mutedBox">No fish found. Try another name or select a different reserve.</div>';
}

  rv.innerHTML=`<div class="hero"><div class="reserveHeroTop"><img class="reserveLogo" src="${RIMG[R]||''}" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none'"><div><div class="eyebrow">Reserve guide · ${esc(REGION[R]||r.region)}</div><h1>${esc(R)}</h1></div></div><div class="stats">${r.stats.map(x=>`<div class="pill">${esc(x)}</div>`).join('')}</div></div>
<div class="section"><h2>Interactive map</h2><div class="searchbar"><input id="mq" class="input" placeholder="Find a fish, bait or habitat on the map…"><button class="switch" id="mclr" hidden>Clear overlay</button></div><div id="mres" class="note"></div><div class="hotspotChips" id="mchips"></div><div class="map" id="hmap"></div><div class="note">Drag to pan, pinch or +/− to zoom (Ctrl + scroll on desktop). Map art from The Angler Wiki.</div></div>
<div class="section"><h2>Fish in ${esc(R)}</h2><div class="searchbar"><input id="q" class="input" placeholder="Search fish, bait, habitat or trait…"><select class="select" id="ftime"><option value="">Any time</option><option>Daytime</option><option>Nighttime</option></select><select class="select" id="ftemp"><option value="">Any temperature</option><option value="cool"></option><option value="warm"></option></select><select class="select" id="fbait"><option value="">Any bait</option>${opt(baits)}</select><select class="select" id="fhab"><option value="">Any habitat</option>${opt(hab)}</select></div><div id="fcount" class="note"></div><div class="grid" id="grid"></div></div>
<div class="section"><h2>Other reserves</h2><div class="reserveCards">${Object.keys(DATA.reserves).filter(n=>n!==R).map(n=>`<button class="reserveCard" data-r="${esc(n)}" style="text-align:left;color:inherit;font:inherit"><img class="reserveCardImg" src="${RIMG[n]||''}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'"><h3>${esc(n)}</h3><p>${esc(REGION[n]||DATA.reserves[n].region)}</p><div class="mini">${DATA.reserves[n].stats.join(' · ')}</div></button>`).join('')}</div></div>`;
  hmap=mkMap($('#hmap'),r.map);
  rv.oninput=e=>{if(e.target.id==='mq')mapSearch();else renderGrid()};rv.onchange=e=>{if(e.target.id!=='mq')renderGrid()};
  rv.onclick=e=>{const f=e.target.closest('[data-f]'),o=e.target.closest('[data-r]'),c=e.target.closest('#mclr');
    if(c){hmap.clear();c.hidden=true;$('#mres').textContent='Overlay cleared.'}
    else if(o)go(o.dataset.r);
    else if(f){const n=f.dataset.f,d=r.records[n];if(f.closest('#mchips')&&d.hotspotMap){hmap.show(d.hotspotMap,()=>$('#mres').textContent=n+': hotspot image could not be loaded.');$('#mres').textContent=n+': wiki hotspot map shown. Other ranks can also be caught there; it is not a Diamond guarantee.';$('#mclr').hidden=false}else go(R,n)}};
  mapSearch();refresh();
}
function mapSearch(){
  const q=$('#mq').value.trim().toLowerCase(),r=DATA.reserves[R],list=r.fish.filter(n=>q?match(r.records[n],n,q):r.records[n].hotspotMap),has=r.fish.some(n=>r.records[n].hotspotMap);
  $('#mres').textContent=q?(list.length?`${list.length} match${list.length>1?'es':''} — tap a fish`:'No match in this reserve.'):has?'Tap a fish to overlay its hotspot map.':"Hotspot maps aren't published for this reserve yet. Zoom the full map or open a fish guide.";
  $('#mchips').innerHTML=list.map(n=>`<button class="hotspotChip" data-f="${esc(n)}">${esc(n)}${r.records[n].hotspotMap?'':' ↗'}</button>`).join('');
}
function renderGrid(){
  const r=DATA.reserves[R],q=$('#q').value.trim().toLowerCase(),tm=$('#ftime').value,tp=$('#ftemp').value,bt=$('#fbait').value,hb=$('#fhab').value;
  let list=r.fish.filter(n=>{const d=r.records[n];return(!q||match(d,n,q))&&(!tm||d.time.includes(tm))&&(!tp||(tp==='cool'?d.temperature.ideal<=10:d.temperature.ideal>10))&&(!bt||d.baits.some(b=>b[0]===bt))&&(!hb||d.habitats.includes(hb))});
  const pct=d=>(d.baits.find(b=>b[0]===bt)||[0,0])[1];if(bt)list.sort((a,b)=>pct(r.records[b])-pct(r.records[a]));
  $('#fcount').textContent=`${list.length} of ${r.fish.length} fish`;
  $('#grid').innerHTML=list.map(n=>{const d=r.records[n];return`<button class="fish" data-f="${esc(n)}"><div class="fishpic"><img src="${d.image}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="imgFail(this)"></div><div class="fishbody"><h3>${esc(n)}</h3><p>${esc(wt(d.weight))} · Ideal ${tc(d.temperature.ideal)}</p>${bt?`<div class="hit">${esc(bt)} · ${pct(d)}%</div>`:''}</div></button>`}).join('')||'<div class="mutedBox">No fish match those filters.</div>';
}
function refresh(){
  document.querySelectorAll('[data-u]').forEach(b=>b.classList.toggle('active',b.dataset.u===unit));document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('active',b.dataset.t===tu));
  const t=$('#ftemp');if(t){t.options[1].text='Cool: ideal ≤ '+(tu==='celsius'?'10 °C':'50 °F');t.options[2].text='Warm: ideal > '+(tu==='celsius'?'10 °C':'50 °F');renderGrid()}
  if(lastFish)fishDyn(lastFish);
}
function fishDyn(f){
  const d=rec()[f],F=(a,b)=>`<div class="row"><small>${a}</small><strong>${esc(b)}</strong></div>`;
  $('#fpills').innerHTML=`<div class="pill">🐟 ${esc(wt(d.weight))}</div><div class="pill">🌡️ Ideal ${tc(d.temperature.ideal)}</div><div class="pill">🕐 ${esc(d.time)}</div>`;
  $('#ffacts').innerHTML=F('Preferred bait',d.preferred)+F('Best time',d.time)+F('Max weight',wt(d.weight))+F('Water temp',trange(d.temperature))+F('Ideal temp',tc(d.temperature.ideal))+F('Spawn depth',sd(d.spawnDepth))+F('Max water depth',dn(d.maxDepth));
}
function fishPage(f){
  const r=DATA.reserves[R],d=r.records[f],key=R+'/'+f;rv.hidden=true;fv.hidden=false;
  if(built!==key){built=key;
    const lg=(DATA.legendaryHooks[R]||{})[f]||{},tag=a=>(a&&a.length?a:[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')||'<div class="mutedBox">Not listed.</div>',
    ranks=d.hookRanks||Object.entries(d.hookMap||{}).map(([h,k])=>({rank:k,hooks:[h]})),
    hrows=ranks.map(x=>`<tr><td class="rank">${esc(x.rank)}</td><td>${esc(x.hooks.join(', '))}</td></tr>`).join('')+Object.entries(lg).map(([n,h])=>`<tr class="legendary-row"><td class="rank">Legendary</td><td>${esc(n)} — ${esc(h.join(', '))}</td></tr>`).join(''),
    tiers=[...new Set(d.baits.map(b=>b[1]))].sort((a,b)=>b-a),
    baits=tiers.map(p=>`<div class="tier">${p}%</div>`+d.baits.filter(b=>b[1]===p).map(b=>`<span class="tag${b[0]===d.preferred?' pref':''}">${b[0]===d.preferred?'★ ':''}${esc(b[0])}</span>`).join('')).join('');
    fv.innerHTML=`<div class="hero"><div class="eyebrow">${esc(R)} · Fish guide</div><h1>${esc(f)}</h1><div class="stats" id="fpills"></div></div><div class="detailgrid section"><div><div class="card"><div class="imageWrap"><img class="heroimg" src="${d.image}" alt="${esc(f)}" referrerpolicy="no-referrer" onerror="imgFail(this)"></div><div class="rows" id="ffacts" style="margin-top:12px"></div><div class="section"><h2>Habitat</h2>${tag(d.habitats)}</div></div><div class="card" style="margin-top:18px"><h2>Hotspot map</h2>${d.hotspotMap?`<div class="map" id="fmap"></div><div class="note">${esc(d.hotspotStatus||'')} Drag to pan, pinch or +/− to zoom.</div>`:'<div class="mutedBox">No hotspot map is published for this species yet.</div>'}</div></div><div><div class="card"><h2>Bait &amp; lure preferences</h2>${baits}</div><div class="card" style="margin-top:18px"><h2>Traits</h2>${tag(d.traits)}</div><div class="card" style="margin-top:18px"><h2>Hook size by target rank</h2><table class="hooks"><thead><tr><th>Rank</th><th>Hook</th></tr></thead><tbody>${hrows||'<tr><td colspan="2">No hook chart.</td></tr>'}</tbody></table></div></div></div><div class="source">Source: <a href="${d.source}" target="_blank" rel="noopener">The Angler Wiki</a> (community-maintained; may contain errors).</div>`;
    if(d.hotspotMap)mkMap($('#fmap'),r.map).show(d.hotspotMap);
  }
  fishDyn(f);
}
function showFish(f){
  if(f){if(!lastFish)scrollRv=scrollY;fishPage(f);if(f!==lastFish)scrollTo(0,0)}
  else{rv.hidden=false;fv.hidden=true;if(lastFish)scrollTo(0,scrollRv)}
  lastFish=f;back.hidden=!f;document.title=f?f+' · Angler Guide':'Angler Guide 2.0';
}
function route(){
  const raw=location.hash.slice(1);
  const path=decodeURIComponent(raw.startsWith('/')?raw.slice(1):raw).split('/');
  const isHome=!raw||raw==='/'||path[0]===''||path[0].toLowerCase()==='home';
  if(isHome){
    home.hidden=false;rv.hidden=true;fv.hidden=true;sel.hidden=true;back.hidden=true;
    if(!home.dataset.built){buildHome();home.dataset.built='1'}
    document.title='Angler Guide · Home';scrollTo(0,0);return;
  }
  home.hidden=true;sel.hidden=false;
  let rn=path[0];
  if(!DATA.reserves[rn])rn=DATA.reserves[store.get('reserve','')]?store.get('reserve',''):Object.keys(DATA.reserves)[0];
  if(R!==rn){R=rn;store.set('reserve',rn);lastFish=null;built=null;buildReserve();sel.value=rn;scrollTo(0,0)}
  showFish(path[1]&&rec()[path[1]]?path[1]:null);
}
sel.innerHTML=Object.keys(DATA.reserves).map(n=>`<option>${esc(n)}</option>`).join('');
sel.onchange=()=>go(sel.value);back.onclick=()=>go(R);$('#homeBtn').onclick=()=>goHome();function goHome(){location.hash='/'}
$('#gear').onclick=()=>$('#set').showModal();$('#close').onclick=()=>$('#set').close();
$('#set').onclick=e=>{const u=e.target.closest('[data-u]'),t=e.target.closest('[data-t]');if(e.target.id==='set')e.target.close();if(u){unit=u.dataset.u;store.set('unit',unit)}if(t){tu=t.dataset.t;store.set('temp',tu)}if(u||t)refresh()};
addEventListener('hashchange',route);route();refresh();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script></body></html>
